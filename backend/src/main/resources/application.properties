spring.datasource.url=jdbc:h2:mem:guaudb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# La consola de H2 expone la base: solo se habilita explícitamente en local (SPRING_H2_CONSOLE_ENABLED=true).
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
# Render (y la mayoría de los hostings) inyecta el puerto en la variable PORT.
server.port=${PORT:8080}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Orígenes permitidos por CORS (separados por coma, sin path ni barra final).
guau.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
