name: Deploy front to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: front

      - name: Tests
        run: npm test
        working-directory: front

      # Sin VITE_API_URL la demo corre con un backend simulado en el navegador (modo mock).
      # Con VITE_API_URL definida (variable de repositorio), el front usa el backend real.
      - name: Build
        run: npm run build
        working-directory: front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USE_MOCK: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
