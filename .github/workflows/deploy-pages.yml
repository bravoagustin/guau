name: Deploy front to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['front/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Avisar si falta la URL del backend
        if: ${{ vars.VITE_API_URL == '' }}
        run: echo "::warning::Falta la variable de repositorio VITE_API_URL. El front se publica pero no va a poder hablar con el backend."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: front

      - name: Build
        run: npm run build
        working-directory: front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: front/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
